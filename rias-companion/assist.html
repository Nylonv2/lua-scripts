<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Rias</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* The assistant sheet (long-press home / "Hey Rias"). AssistActivity hosts it over whatever is on screen. */
    html, body.assist-page { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text, #f6e9ee);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .as-dim { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 100%, rgba(var(--a3), .28), rgba(0, 0, 0, .62) 60%); animation: as-fade .3s ease-out; }
    .as-sheet { position: fixed; left: 0; right: 0; bottom: 0; padding: 74px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 30px 30px 0 0;
      background: radial-gradient(140% 70% at 50% 0%, rgba(var(--a2), .22), transparent 60%), linear-gradient(180deg, rgba(var(--glass2), .97), rgba(var(--glass), .985) 45%, var(--d3) 100%);
      box-shadow: 0 -18px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); animation: as-up .42s cubic-bezier(.2, .9, .25, 1.1); }
    .as-sheet::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px 1px 0; pointer-events: none;
      background: linear-gradient(140deg, rgba(240, 207, 133, .7), rgba(255, 255, 255, .06) 35%, rgba(255, 255, 255, .03) 65%, rgba(var(--a2), .6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .as-sparks { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
    .as-sparks i { position: absolute; bottom: -10px; color: rgba(240, 207, 133, .6); font-style: normal; font-size: 10px; animation: as-rise 7s linear infinite; }

    /* Her portrait rising out of the sheet, inside the turning magic circle */
    .as-portrait { position: absolute; left: 50%; top: -66px; width: 132px; height: 132px; transform: translateX(-50%); }
    .as-ring { position: absolute; inset: -16px; color: rgba(240, 207, 133, .75); animation: as-spin 26s linear infinite; filter: drop-shadow(0 0 8px rgba(var(--a2), .7)); }
    .as-ring.inner { inset: -4px; color: rgba(var(--a2), .9); animation-duration: 16s; animation-direction: reverse; opacity: .7; }
    .as-face { position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 35%, var(--art1), var(--art2));
      box-shadow: 0 0 0 2px rgba(240, 207, 133, .8), 0 0 0 5px rgba(var(--a3), .55), 0 10px 30px rgba(0, 0, 0, .6), 0 0 34px rgba(var(--a2), .55); }
    .as-face img { width: 100%; height: 100%; object-fit: cover; }
    .as-face .stage { position: absolute; width: 190%; left: -45%; top: -30%; margin: 0; }
    .as-face .stage .circle { display: none; }
    .as-portrait.speaking .as-face { animation: as-pulse 1s ease-in-out infinite; }
    .as-portrait.listening .as-ring { animation-duration: 6s; color: rgba(255, 220, 160, .95); }

    .as-head { text-align: center; }
    .as-name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.55rem; letter-spacing: .02em; color: #f0cf85; text-shadow: 0 0 18px rgba(var(--a2), .5); }
    .as-status { margin-top: 2px; font-family: Georgia, serif; font-style: italic; font-size: .9rem; color: rgba(246, 233, 238, .62); min-height: 1.2em; }

    .as-talk { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 6px; max-height: 38vh; overflow-y: auto; }
    .as-bubble { max-width: 86%; padding: 10px 14px; border-radius: 20px; line-height: 1.4; font-size: 1rem; animation: as-pop .3s ease-out; white-space: pre-wrap; }
    .as-me { align-self: flex-end; background: linear-gradient(135deg, var(--g1), var(--g2)); border-bottom-right-radius: 6px; box-shadow: 0 6px 18px rgba(var(--a3), .4); }
    .as-me.live { opacity: .75; font-style: italic; }
    .as-her { align-self: flex-start; background: rgba(var(--glass2), .9); border: 1px solid rgba(240, 207, 133, .22); border-bottom-left-radius: 6px; font-size: 1.06rem; }
    .as-dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .as-dots b { width: 7px; height: 7px; border-radius: 50%; background: #f0cf85; animation: as-dot 1.1s ease-in-out infinite; }
    .as-dots b:nth-child(2) { animation-delay: .15s; } .as-dots b:nth-child(3) { animation-delay: .3s; }

    .as-chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; scrollbar-width: none; }
    .as-chips::-webkit-scrollbar { display: none; }
    .as-chips button { flex: none; padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(240, 207, 133, .4); background: rgba(240, 207, 133, .08);
      color: #f0cf85; font: inherit; font-size: .86rem; }

    .as-controls { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 14px; }
    .as-side { width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .07); color: #f6e9ee;
      display: grid; place-items: center; }
    .as-side svg { width: 22px; height: 22px; }
    .as-mic { position: relative; width: 78px; height: 78px; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, var(--g1), var(--g2) 70%); box-shadow: 0 10px 28px rgba(var(--a3), .55), inset 0 2px 0 rgba(255, 255, 255, .25); }
    .as-mic svg { width: 32px; height: 32px; position: relative; z-index: 1; }
    .as-mic::before, .as-mic::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(var(--a2), .55); opacity: 0; }
    .as-mic.on::before { animation: as-wave 1.6s ease-out infinite; }
    .as-mic.on::after { animation: as-wave 1.6s ease-out .8s infinite; }
    .as-level { position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--a2), .45), transparent 70%);
      transform: scale(var(--lv, 0)); transition: transform .08s linear; }
    .as-type { display: flex; gap: 8px; margin-top: 12px; }
    .as-type[hidden] { display: none; }
    .as-type input { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .08);
      color: #fff; font: inherit; font-size: 1rem; outline: none; }
    .as-type input:focus { border-color: rgba(240, 207, 133, .6); }
    .as-type button { width: 46px; height: 46px; border-radius: 50%; border: 0; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); }

    /* Quiet style: just a small glowing Rias bubble; she answers out loud, nothing to read. */
    body.quiet .as-dim, body.quiet .as-head, body.quiet .as-talk, body.quiet .as-chips, body.quiet .as-type, body.quiet .as-controls, body.quiet .as-sparks { display: none !important; }
    body.quiet .as-sheet { inset: 0; padding: 0; background: none; box-shadow: none; border-radius: 0; animation: none; }
    body.quiet .as-sheet::before { display: none; }
    body.quiet .as-portrait { top: 50%; width: 74px; height: 74px; transform: translate(-50%, -50%); animation: as-in .35s cubic-bezier(.2, .9, .25, 1.3); cursor: pointer; }
    body.quiet .as-ring { inset: -11px; }
    body.quiet .as-ring.inner { inset: -3px; }
    body.quiet .as-face { inset: 4px; box-shadow: 0 0 0 2px rgba(240, 207, 133, .8), 0 6px 20px rgba(0, 0, 0, .55), 0 0 24px rgba(var(--a2), .6); }
    .as-glow { position: absolute; inset: -22px; border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(var(--a2), .55), rgba(var(--a2), 0) 68%); transform: scale(calc(.75 + var(--lv, 0) * .5)); transition: transform .08s linear, opacity .3s; }
    body.quiet .as-portrait.listening .as-glow, body.quiet .as-portrait.speaking .as-glow { opacity: 1; }
    body.quiet .as-portrait.speaking .as-glow { animation: as-breathe 1.2s ease-in-out infinite; }
    body.quiet .as-portrait.thinking .as-ring { animation-duration: 2.2s; }
    body.quiet .as-portrait.leaving { animation: as-out .3s ease-in forwards; }
    @keyframes as-in { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
    @keyframes as-out { to { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
    @keyframes as-breathe { 50% { transform: scale(1.15); } }

    /* Discreet mode: a plain assistant bubble, no portrait, no magic circle */
    html[data-plain="1"] .as-ring, html[data-plain="1"] .as-sparks, html[data-plain="1"] .as-sheet::before { display: none; }
    html[data-plain="1"] .as-face, html[data-plain="1"] body.quiet .as-face { background: url(icons/plain.svg) center / cover; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
    html[data-plain="1"] .as-portrait.speaking .as-face { animation: none; }
    html[data-plain="1"] .as-sheet { background: #141a26; }
    html[data-plain="1"] .as-name { font-family: inherit; font-weight: 600; font-size: 1.2rem; color: var(--text); text-shadow: none; }
    html[data-plain="1"] .as-status { font-family: inherit; font-style: normal; }
    html[data-plain="1"] .as-her { border-color: rgba(255, 255, 255, .08); }
    html[data-plain="1"] .as-chips button { border-color: rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: var(--text); }
    html[data-plain="1"] .as-dots b { background: var(--muted); }

    @keyframes as-up { from { transform: translateY(100%); } }
    @keyframes as-fade { from { opacity: 0; } }
    @keyframes as-spin { to { transform: rotate(360deg); } }
    @keyframes as-pulse { 50% { box-shadow: 0 0 0 2px rgba(240, 207, 133, .9), 0 0 0 7px rgba(var(--a3), .6), 0 10px 30px rgba(0, 0, 0, .6), 0 0 48px rgba(var(--a2), .85); } }
    @keyframes as-wave { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes as-pop { from { transform: translateY(8px) scale(.97); opacity: 0; } }
    @keyframes as-dot { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-4px); opacity: 1; } }
    @keyframes as-rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-340px); opacity: 0; } }
  </style>
</head>
<body class="assist-page">
  <div class="as-dim" id="dim"></div>
  <div class="as-sheet" id="sheet">
    <div class="as-sparks" aria-hidden="true"></div>
    <div class="as-portrait" id="portrait">
      <svg class="as-ring" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="97" stroke-width="1.3"/><circle cx="100" cy="100" r="90" stroke-width=".6" stroke-dasharray="2 4"/>
        <polygon points="100,6 181,147 19,147" stroke-width=".9"/><polygon points="100,194 19,53 181,53" stroke-width=".9"/></g></svg>
      <svg class="as-ring inner" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="98" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="10 6 2 6"/></svg>
      <div class="as-glow" id="glow"></div>
      <div class="as-face" id="face"></div>
    </div>
    <div class="as-head">
      <div class="as-name">Rias Gremory</div>
      <div class="as-status" id="status">I'm listening~</div>
    </div>
    <div class="as-talk" id="talk"></div>
    <div class="as-chips" id="chips"></div>
    <form class="as-type" id="type" hidden>
      <input id="type-in" placeholder="Say something to her…" autocomplete="off" enterkeyhint="send">
      <button type="submit" aria-label="Send">➤</button>
    </form>
    <div class="as-controls">
      <button type="button" class="as-side" id="kb" aria-label="Type instead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg></button>
      <button type="button" class="as-mic" id="mic" aria-label="Talk"><span class="as-level" id="level"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button type="button" class="as-side" id="open" aria-label="Open the app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></button>
    </div>
  </div>
  <script src="rias-avatar.js"></script>
  <script>
    (() => {
      'use strict';
      const N = window.AssistNative || { data: () => '{}', mic() {}, send() {}, open() {}, close() {}, touch() {} };
      const $ = (id) => document.getElementById(id);
      let d = {};
      try { d = JSON.parse(N.data()); } catch { /* preview */ }
      document.documentElement.dataset.theme = d.theme || 'crimson';
      const quiet = d.style !== 'full';
      document.body.classList.toggle('quiet', quiet);

      if (d.plain) {
        document.documentElement.dataset.plain = '1';
        document.title = d.name || 'Assistant';
        document.querySelector('.as-name').textContent = d.name || 'Assistant';
        $('status').textContent = 'Listening…';
      }
      // Her picture, or the animated Rias (same choice as Home).
      let avatar = null;
      if (d.plain) {
        /* the plain icon is drawn by CSS */
      } else if (d.pic && d.homeChar === 'picture') {
        const img = document.createElement('img');
        img.src = d.pic; img.alt = '';
        $('face').append(img);
      } else if (window.createRiasAvatar) {
        const stage = document.createElement('div');
        stage.className = 'stage';
        $('face').append(stage);
        avatar = window.createRiasAvatar(stage);
        if (d.outfit) avatar.setOutfit(d.outfit);
        avatar.setMood('happy');
        setTimeout(() => avatar.setMood('neutral'), 1500);
      }
      const sparks = document.querySelector('.as-sparks');
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('i');
        s.textContent = '✦';
        s.style.left = `${6 + Math.random() * 88}%`;
        s.style.animationDelay = `${(Math.random() * 7).toFixed(1)}s`;
        sparks.append(s);
      }

      const CHIPS = d.chips && d.chips.length ? d.chips : ['How\'s my day?', 'Set a timer for 10 minutes', 'What time is it?', 'What did I miss?', 'What\'s the weather?'];
      for (const c of CHIPS) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = c;
        b.onclick = () => N.send(c);
        $('chips').append(b);
      }

      const talk = $('talk');
      let live = null, her = null, typer = 0;
      const scroll = () => { talk.scrollTop = talk.scrollHeight; };
      function bubble(cls, text) {
        const b = document.createElement('div');
        b.className = `as-bubble ${cls}`;
        b.textContent = text;
        talk.append(b);
        while (talk.children.length > 8) talk.firstChild.remove();
        scroll();
        return b;
      }
      // Her words appear as she says them.
      function typeOut(el, text) {
        clearInterval(typer);
        let i = 0;
        el.textContent = '';
        typer = setInterval(() => {
          i += Math.max(1, Math.round(text.length / 90));
          el.textContent = text.slice(0, i);
          scroll();
          if (i >= text.length) clearInterval(typer);
        }, 22);
      }

      window.assist = {
        // { state: listening|thinking|speaking|idle, status, heard (live or final), final, answer, level }
        update(o) {
          if (o.status != null) $('status').textContent = o.status;
          if (o.state) {
            $('mic').classList.toggle('on', o.state === 'listening');
            $('portrait').classList.toggle('listening', o.state === 'listening');
            $('portrait').classList.toggle('speaking', o.state === 'speaking');
            $('portrait').classList.toggle('thinking', o.state === 'thinking');
            if (o.state === 'leaving') $('portrait').classList.add('leaving');
            $('chips').hidden = o.state !== 'idle' || talk.children.length > 0;
            if (o.state !== 'listening') $('level').style.setProperty('--lv', 0);
            if (o.state === 'listening' && avatar) avatar.setMood('neutral');
          }
          if (o.level != null) {
            const lv = Math.max(0, Math.min(1, (o.level + 2) / 12)).toFixed(2);
            $('level').style.setProperty('--lv', lv);
            $('glow').style.setProperty('--lv', lv);
          }
          if (quiet) return; // the quiet bubble shows no words
          if (o.heard != null) {
            if (!live) live = bubble('as-me live', '');
            live.textContent = o.heard;
            if (o.final) { live.classList.remove('live'); live = null; her = bubble('as-her', ''); her.innerHTML = '<span class="as-dots"><b></b><b></b><b></b></span>'; }
            scroll();
          }
          if (o.answer != null) {
            if (!her) her = bubble('as-her', '');
            typeOut(her, o.answer);
            her = null;
            if (avatar) { avatar.setMood('happy'); avatar.talk(o.answer.length * 55); }
          }
          if (o.clear) { talk.textContent = ''; live = null; her = null; }
        },
      };

      $('mic').onclick = () => { N.touch(); N.mic(); };
      // Quiet bubble: tap to stop listening (send now), or to hush her and close.
      $('portrait').onclick = () => { if (quiet && N.tap) N.tap(); };
      $('open').onclick = () => N.open();
      $('dim').onclick = () => N.close();
      $('sheet').addEventListener('pointerdown', () => N.touch());
      $('kb').onclick = () => {
        const f = $('type');
        f.hidden = !f.hidden;
        if (!f.hidden) { N.touch(); setTimeout(() => $('type-in').focus(), 50); }
      };
      $('type').onsubmit = (e) => {
        e.preventDefault();
        const v = $('type-in').value.trim();
        if (!v) return;
        $('type-in').value = '';
        $('type-in').blur();
        N.send(v);
      };
      try { N.ready(); } catch { /* preview */ }
    })();
  </script>
</body>
</html>
